<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Capabilities — 서비스 구성으로 보는 기술 경험</title>
<desc id="map-desc">여러 프로젝트에서 다룬 기술을 역할별로 배치한 지도. 사용자에서 React·Vite·JavaScript 프런트엔드, Python·Django·DRF API로 연결됩니다. API는 Redis·Meilisearch 검색과 PostgreSQL·MySQL·Azure SQL 데이터베이스를 조회합니다. 분석 흐름은 Fabric Dataflow·Lakehouse·Fact Table·Power BI로 이어집니다. Docker·Compose·Nginx·Gunicorn·HTTPS 실행 환경과 Git·GitHub Actions 배포 자동화가 이를 받칩니다. 클라우드 경험은 AWS S3·RDS·IAM·비용 관리 및 Azure SQL·Microsoft Fabric입니다.</desc>
