<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1720" viewBox="0 0 520 1720" role="img" aria-labelledby="title desc"><title id="title">서비스 역할별 기술 구성도 — 모바일</title><desc id="desc">여러 프로젝트의 기술 경험을 역할별로 구성한 지도. 브라우저의 React는 HTTPS로 Nginx에 요청하고, Nginx는 정적 파일과 Gunicorn·Django 요청을 처리합니다. API는 목적별로 PostgreSQL·MySQL·Azure SQL, Redis, Meilisearch, S3를 호출합니다. Trigram GIN은 PostgreSQL 인덱스입니다. Fabric Dataflow·Lakehouse·Fact Table·Power BI는 컨테이너 밖의 분석 영역입니다. GitHub Actions와 Vite는 개발·빌드·배포 영역에 있습니다. AWS IAM과 비용 관리도 포함합니다.</desc><defs>
<marker id="request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1.2 7 4 1 6.8" fill="none" stroke="#b8b0a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1.2 7 4 1 6.8" fill="none" stroke="#d19b7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
