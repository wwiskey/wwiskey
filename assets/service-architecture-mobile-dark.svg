<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1444.8" viewBox="0 0 520 1444.8" role="img" aria-labelledby="title desc"><title id="title">서비스 역할별 기술 구성도 — 모바일</title><desc id="desc">여러 프로젝트의 기술 경험을 역할별로 구성한 지도. 브라우저의 React는 HTTPS로 Nginx에 요청하고, Nginx는 정적 파일과 Gunicorn·Django 요청을 처리합니다. API는 목적별로 PostgreSQL·MySQL·Azure SQL, Redis, Meilisearch, S3를 호출합니다. Fabric Dataflow·Lakehouse·Fact Table·Power BI는 컨테이너 밖의 분석 영역입니다. GitHub Actions와 Vite는 개발·빌드·배포 영역에 있습니다. AWS IAM과 비용 관리도 포함합니다.</desc><defs>
